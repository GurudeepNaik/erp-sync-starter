[project]
name = "erp-sync-starter"
version = "0.1.0"
description = "Reliable two-way sync between a Postgres ERP and a CRM: outbox, retries, idempotency, conflict policy."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gurudeep Naik" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.scripts]
erpsync = "erpsync.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erpsync"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["erpsync"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
